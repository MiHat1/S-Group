<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            width: 340px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .card-banner {
            height: 100px;
            background: #c7d2fe;
        }

        .card-body {
            padding: 0 24px 24px;
        }

        .avatar-wrap {
            margin-top: -40px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #818cf8;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            font-weight: 600;
        }

        .name {
            font-size: 20px;
            font-weight: 600;
            color: #1e1b4b;
            margin-bottom: 4px;
        }

        .role {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 14px;
            color: #374151;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 3px solid #818cf8;
        }

        .stats {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 10px 8px;
            background: #f5f3ff;
            border-radius: 10px;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 600;
            color: #4f46e5;
        }

        .stat-label {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }

        .skill-tag , #addskills {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 99px;
            background: #ede9fe;
            color: #5b21b6;
            font-weight: 500;
        }
        .btn-follow {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: none;
            background: blue;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-follow:hover {
            background: #4338ca;
        }

       
    </style>
</head>

<body>

    <div class="card">
        <div class="card-banner" id="banner"></div>
        <div class="card-body">

            <div class="avatar-wrap">
                <div class="avatar" id="avatar"></div>
            </div>

            <div class="name" id="name" contenteditable="true"></div>
            <div class="role" id="role">Frontend Developer · Đà Nẵng</div>

            <div class="bio" id="bio">
                Mình thích xây dựng giao diện đẹp và học những thứ mới mỗi ngày. Đang học JavaScript!
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-num" id="stat-posts">12</div>
                    <div class="stat-label">Bài viết</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-followers">348</div>
                    <div class="stat-label">Theo dõi</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-likes">1.2k</div>
                    <div class="stat-label">Lượt thích</div>
                </div>
            </div>

            <div class="skills" id="skills">
                <span class="skill-tag">HTML</span>
                <span class="skill-tag">CSS</span>
                <span class="skill-tag">JavaScript</span>
                <button id="addskills">+</button>
            </div>


            <button class="btn-follow" id="btn-follow">Theo dõi</button>

        </div>
    </div>
    <script src="main.js"></script>

</body>

</html>
